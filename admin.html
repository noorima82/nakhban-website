<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل ادمین — مدرسه کنکور نخبان</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#0F2351;--navy2:#081431;--gold:#F5B841;--gold2:#E88A00;--ink:#101C33;--muted:#6B7385;--line:#ECEEF3}
*{box-sizing:border-box}
body{margin:0;font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;background:#F1F2F5;color:var(--ink);min-height:100vh}
header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:16px 22px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:5;box-shadow:0 6px 18px rgba(8,20,49,.25)}
header img{height:34px;width:auto}
header b{font-size:16px;font-weight:900}
header .sp{flex:1}
header .exit{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:7px 14px;
  cursor:pointer;font-family:inherit;font-size:12px;font-weight:800}
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.tabs{display:flex;gap:8px;margin:6px 0 16px}
.tab{flex:1;border:0;border-radius:14px;padding:12px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800;
  background:#fff;color:var(--muted);box-shadow:0 2px 8px rgba(16,28,51,.06);transition:all .2s;position:relative}
.tab.on{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff}
.tab .badge{position:absolute;top:-7px;inset-inline-end:-7px;min-width:22px;height:22px;border-radius:999px;background:#E23339;
  color:#fff;font-size:11px;display:grid;place-items:center;padding:0 6px;box-shadow:0 3px 8px rgba(160,20,25,.4)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar .count{font-size:12.5px;font-weight:800;color:var(--muted)}
.bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font-family:inherit;font-weight:800;border-radius:12px;
  padding:11px 18px;font-size:13px;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn-gold{background:linear-gradient(120deg,var(--gold),var(--gold2));color:#5C1A00;box-shadow:0 6px 14px rgba(160,100,0,.3)}
.btn-ghost{background:#fff;color:#33415C;border:1.5px solid var(--line)}
/* login */
#login{max-width:420px;margin:9vh auto 0;background:#fff;border-radius:20px;padding:26px;box-shadow:0 20px 50px rgba(8,20,49,.18);text-align:center}
#login img{height:64px;width:auto;margin-bottom:8px}
#login h2{margin:0 0 4px;font-size:18px;font-weight:900}
#login p{font-size:12px;color:var(--muted);margin:0 0 14px}
#login input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:14px;
  outline:none;margin-bottom:10px}
#login input:focus{border-color:var(--gold2)}
#login .err{display:none;color:#D3273A;font-size:12px;font-weight:700;background:#FDECEF;border-radius:10px;padding:8px 12px;margin-bottom:10px}
/* registrants */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.reg{background:#fff;border-radius:18px;padding:15px;box-shadow:0 4px 14px rgba(16,28,51,.07);border-inline-start:4px solid var(--gold2)}
.reg .nm{font-size:15px;font-weight:900}
.reg .ph{direction:ltr;text-align:left;font-size:13.5px;font-weight:800;color:var(--navy);letter-spacing:.03em;margin-top:3px}
.reg .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11px;font-weight:800;border-radius:999px;padding:3px 11px;background:#F1F2F5;color:#4A5568}
.tag.f{background:#FFF3D6;color:#8A5A00}
.tag.g{background:#E8F4EC;color:#1F7A46}
.reg .dt{font-size:10.5px;color:#9AA2B4;margin-top:8px}
/* threads */
.threads{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
@media(max-width:760px){.threads{grid-template-columns:1fr}}
.tlist{background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(16,28,51,.07);overflow:hidden}
.titem{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;border-bottom:1px solid var(--line);transition:background .15s}
.titem:hover{background:#F7F8FA}
.titem.on{background:#FFF7E6}
.tava{width:38px;height:38px;border-radius:50%;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#FFD65C;
  display:grid;place-items:center;font-weight:900;font-size:15px;flex:0 0 auto}
.twho{flex:1;min-width:0}
.twho b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.twho small{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.unread{min-width:20px;height:20px;border-radius:999px;background:#E23339;color:#fff;font-size:10.5px;font-weight:800;
  display:grid;place-items:center;padding:0 6px}
.tchat{background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(16,28,51,.07);display:flex;flex-direction:column;
  height:min(560px,72vh)}
.tchat .head{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:900;font-size:14px;display:flex;align-items:center;gap:8px}
.tchat .head small{font-weight:700;color:var(--muted);font-size:11px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#F7F8FA}
.msg{max-width:76%;padding:9px 13px;border-radius:15px;font-size:12.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word;
  box-shadow:0 2px 6px rgba(16,28,51,.06)}
.msg.user{align-self:flex-start;background:#fff;border-bottom-right-radius:4px}
.msg.admin{align-self:flex-end;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-bottom-left-radius:4px}
.msg time{display:block;font-size:9px;opacity:.6;margin-top:3px}
.reply{display:flex;gap:8px;padding:11px;border-top:1px solid var(--line)}
.reply input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:11px 16px;font-family:inherit;font-size:12.5px;outline:none}
.reply button{flex:0 0 auto;border:0;border-radius:999px;width:46px;cursor:pointer;font-size:16px;
  background:linear-gradient(120deg,var(--gold),var(--gold2));color:#5C1A00}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:13px;background:#fff;border-radius:18px;padding:40px}
.hint{font-size:11px;color:#9AA2B4;text-align:center;margin-top:14px}
</style>
</head>
<body>

<div id="login">
  <img src="assets/noknban-fa.png" alt="نخبان">
  <h2>پنل مدیریت نخبان</h2>
  <p>برای ادامه، کلید مدیریتی را وارد کن</p>
  <div class="err" id="lgErr"></div>
  <input id="key" type="password" placeholder="کلید مدیریتی" dir="ltr">
  <button class="btn btn-gold" id="loginBtn" style="width:100%;justify-content:center">ورود</button>
</div>

<div id="app" style="display:none">
  <header>
    <img src="assets/noknban-fa.png" alt="نخبان">
    <b>پنل مدیریت نخبان</b>
    <span class="sp"></span>
    <button class="exit" id="exitBtn">خروج</button>
  </header>
  <main>
    <div class="tabs">
      <button class="tab on" id="tabRegs">ثبت‌نام‌ها <span class="badge" id="bRegs" style="display:none">0</span></button>
      <button class="tab" id="tabChat">گفت‌وگوها <span class="badge" id="bChat" style="display:none">0</span></button>
    </div>

    <section id="secRegs">
      <div class="bar">
        <span class="count" id="regCount"></span>
        <span class="sp"></span>
        <button class="btn btn-gold" id="xlsxBtn">دانلود اکسل ثبت‌نام‌ها</button>
        <button class="btn btn-ghost" id="refreshBtn">به‌روزرسانی</button>
      </div>
      <div class="grid" id="regGrid"></div>
    </section>

    <section id="secChat" style="display:none">
      <div class="threads">
        <div class="tlist" id="tlist"></div>
        <div class="tchat" id="tchat" style="display:none">
          <div class="head" id="thead"></div>
          <div class="msgs" id="tmsgs"></div>
          <form class="reply" id="replyForm">
            <input id="replyText" placeholder="پاسخ‌ات را بنویس..." autocomplete="off">
            <button type="submit" aria-label="ارسال">➤</button>
          </form>
        </div>
        <div class="empty" id="chatEmpty">یک گفت‌وگو را از فهرست انتخاب کن</div>
      </div>
    </section>
    <p class="hint">این صفحه مخفی است؛ آدرس آن را فقط با اعضای پشتیبانی به اشتراک بگذار.</p>
  </main>
</div>

<script>
(function(){
  var API='/api/messages';
  var KEY=sessionStorage.getItem('nb_admin_key')||'';
  var data={registrants:[],threads:{}};
  var openPhone=null, timer=null;
  var lastSeen=JSON.parse(localStorage.getItem('nb_seen')||'{}');

  function $(id){return document.getElementById(id)}
  function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
  function faDate(iso){
    try{return new Date(iso).toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'})+' — '+
      new Date(iso).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}catch(e){return ''}
  }

  function login(){
    KEY=$('key').value.trim();
    if(!KEY)return;
    fetch(API+'?key='+encodeURIComponent(KEY)).then(function(r){return r.json().then(function(j){return{s:r.status,j:j}})}).then(function(o){
      if(o.s===200){sessionStorage.setItem('nb_admin_key',KEY);$('login').style.display='none';$('app').style.display='block';start()}
      else{var e=$('lgErr');e.textContent='کلید مدیریتی اشتباه است';e.style.display='block'}
    }).catch(function(){var e=$('lgErr');e.textContent='ارتباط با سرور برقرار نشد';e.style.display='block'});
  }
  $('loginBtn').addEventListener('click',login);
  $('key').addEventListener('keydown',function(e){if(e.key==='Enter')login()});
  $('exitBtn').addEventListener('click',function(){sessionStorage.removeItem('nb_admin_key');location.reload()});
  if(KEY){$('key').value=KEY;login()}

  function start(){
    $('tabRegs').addEventListener('click',function(){$('tabRegs').classList.add('on');$('tabChat').classList.remove('on');
      $('secRegs').style.display='block';$('secChat').style.display='none'});
    $('tabChat').addEventListener('click',function(){$('tabChat').classList.add('on');$('tabRegs').classList.remove('on');
      $('secChat').style.display='block';$('secRegs').style.display='none'});
    $('refreshBtn').addEventListener('click',load);
    $('xlsxBtn').addEventListener('click',xlsx);
    $('replyForm').addEventListener('submit',function(e){e.preventDefault();send()});
    load();timer=setInterval(load,4000);
  }

  function load(){
    fetch(API+'?key='+encodeURIComponent(KEY)).then(function(r){return r.json()}).then(function(j){
      if(j.error)return;
      data=j;renderRegs();renderThreads();
    }).catch(function(){});
  }

  function unreadCount(ph){
    var t=data.threads[ph]||[];var seen=lastSeen[ph]||0;
    return t.filter(function(m){return m.from==='user'&&new Date(m.at).getTime()>seen}).length;
  }

  function renderRegs(){
    var g=$('regGrid');var rs=data.registrants;
    $('regCount').textContent='تعداد ثبت‌نام‌ها: '+rs.length;
    $('bRegs').style.display=rs.length?'grid':'none';$('bRegs').textContent=rs.length;
    g.innerHTML=rs.slice().reverse().map(function(r){
      return '<div class="reg"><div class="nm">'+esc(r.name)+'</div><div class="ph">'+esc(r.phone)+'</div>'+
        '<div class="tags"><span class="tag f">'+esc(r.field)+'</span><span class="tag g">'+esc(r.grade)+'</span></div>'+
        '<div class="dt">'+faDate(r.at)+'</div></div>'
    }).join('')||'<div class="empty">هنوز ثبت‌نامی ثبت نشده است</div>';
  }

  function renderThreads(){
    var phs=Object.keys(data.threads).filter(function(p){return (data.threads[p]||[]).length});
    var total=phs.reduce(function(a,p){return a+unreadCount(p)},0);
    $('bChat').style.display=total?'grid':'none';$('bChat').textContent=total;
    var list=$('tlist');
    list.innerHTML=phs.map(function(p){
      var t=data.threads[p]||[];var last=t[t.length-1]||{};
      var name=(data.registrants.find(function(r){return r.phone===p})||{}).name||p;
      var u=unreadCount(p);
      return '<div class="titem'+(p===openPhone?' on':'')+'" data-p="'+p+'">'+
        '<span class="tava">'+esc((name||'؟').trim()[0]||'؟')+'</span>'+
        '<span class="twho"><b>'+esc(name)+'</b><small>'+esc((last.text||'').slice(0,38))+'</small></span>'+
        (u?'<span class="unread">'+u+'</span>':'')+'</div>'
    }).join('')||'<div class="empty" style="grid-column:auto">هنوز پیامی نیست</div>';
    list.querySelectorAll('.titem').forEach(function(el){
      el.addEventListener('click',function(){openPhone=el.getAttribute('data-p');lastSeen[openPhone]=Date.now();
        localStorage.setItem('nb_seen',JSON.stringify(lastSeen));renderThreads();renderChat()})
    });
    if(openPhone){$('tchat').style.display='flex';$('chatEmpty').style.display='none';renderChat()}
  }

  function renderChat(){
    if(!openPhone)return;
    var t=data.threads[openPhone]||[];
    var name=(data.registrants.find(function(r){return r.phone===openPhone})||{}).name||openPhone;
    $('thead').innerHTML=esc(name)+' <small dir="ltr">('+esc(openPhone)+')</small>';
    $('tmsgs').innerHTML=t.map(function(m){
      return '<div class="msg '+(m.from==='user'?'user':'admin')+'">'+esc(m.text)+
        '<time>'+new Date(m.at).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})+'</time></div>'
    }).join('');
    $('tmsgs').scrollTop=$('tmsgs').scrollHeight;
  }

  function send(){
    var txt=$('replyText').value.trim();if(!txt||!openPhone)return;
    $('replyText').value='';
    fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({key:KEY,phone:openPhone,text:txt})}).then(load).catch(load);
  }

  function xlsx(){
    var rows=data.registrants.map(function(r,i){
      return {'#':i+1,'نام و نام خانوادگی':r.name,'شماره موبایل':r.phone,'رشته':r.field,'پایه تحصیلی':r.grade,
        'تاریخ ثبت‌نام':faDate(r.at)}
    });
    if(!rows.length)return;
    var ws=XLSX.utils.json_to_sheet(rows);
    ws['!cols']=[{wch:5},{wch:26},{wch:16},{wch:10},{wch:14},{wch:22}];
    var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'ثبت‌نام‌ها');
    XLSX.writeFile(wb,'noknban-registrants.xlsx');
  }
})();
</script>
</body>
</html>
